schemaVersion: 1
variables:
  - name: organization
    description: Name of the organization
    required: true
  - name: team
    description: Name of the team the consultant joins
    required: true
  - name: team_state
    description: Is the team established, or are we the first consultants?
    type: choice
    options:
      - established
      - first-consultants
    required: true
  - name: discipline
    description: Which discipline is this plan for?
    type: choice
    options:
      - software
      - design
    required: true
  - name: output_style
    description: Target format of the document
    type: choice
    options:
      - markdown
    default: markdown
