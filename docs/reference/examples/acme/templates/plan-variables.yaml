schemaVersion: 1
variables:
  - name: organization
    description: What is the organization's name?
    example: ACME Corp
    required: true
  - name: team
    description: Which team are you joining?
    example: Platform team
    required: true
    audience: onboardee
  - name: team_state
    description: Is the team established, or are we the first consultants?
    type: choice
    options:
      - established
      - first-consultants
    required: true
  - name: discipline
    description: What kind of work will you do?
    type: choice
    options:
      - software
      - design
    required: true
    audience: onboardee
