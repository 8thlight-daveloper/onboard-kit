name: package

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  archives:
    uses: ./.github/workflows/release-archives.yml
    with:
      version: v0.0.0-ci

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          summarize: false
      - name: Build the Nix package
        run: nix build .#default --no-link
