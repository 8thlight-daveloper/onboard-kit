StylesPath = .vale/styles
MinAlertLevel = warning
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[*.md]
BasedOnStyles = OnboardKit

# A hand-written golden of the tool's output, not authored prose.
[docs/reference/examples/acme/acme.md]
BasedOnStyles =

# Prose inside YAML strings, such as template body and notes fields. Vale reads
# the file as Markdown text. Headings do not exist in YAML, so # comments would
# be misread as headings.
[formats]
yaml = md

[*.yaml]
BasedOnStyles = OnboardKit
OnboardKit.HeadingCase = NO
