name: catalog-all-raw-exports
description: Every catalog identity exports its complete literal YAML or Markdown bytes from the standalone binary with no wrapper or local writes.
source: docs/decisions/0320-embedded-catalog-availability.md; contracts/catalog/reader/content/; contracts/command/catalog/contract.md Export
steps:
  - run: ["onboard-kit","catalog","export","--id","application-local"]
    files:
      plan.obk.yaml: "PRIVATE_EXISTING_PLAN_BYTES\n"
      preparation.obk.yaml: "PRIVATE_EXISTING_PREPARATION_BYTES\n"
      record.obk.yaml: "PRIVATE_EXISTING_RECORD_BYTES\n"
      company-email.yaml: "PRIVATE_EXISTING_CUSTOM_TEMPLATE_BYTES\n"
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: application-local
          title: Run the application locally
          summary: Exercise the application
          timing: week-one
          variables:
            - {name: local_run_instructions, description: "What reviewed local startup, shutdown and safe data instructions apply?", audience: onboarder, required: true}
            - {name: local_exercise, description: "Which harmless user journey should verify local behavior and who can help?", audience: onboarder, required: true}
          body: |
            Review the local application instructions: $local_run_instructions
            Exercise the approved behavior: $local_exercise
          
            Check environment and data sources before starting anything. Use approved
            sample data, not copied production data or personal credentials. Follow a
            representative flow and inspect its result, then shut down as documented.
            A running process alone is not a usable application. Report missing setup
            or differing instructions rather than changing shared services to fit them.
          steps:
            - id: exercise-local-flow
              name: Exercise a safe local application flow
              checks:
                - ask: Can you complete the approved local flow and explain how to start and stop the application safely?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=artifact-access"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: artifact-access
          title: Package or artifact registry access
          summary: Obtain required dependencies and artifacts
          timing: anytime
          variables:
            - {name: artifact_scope, description: "Which approved registry and exact dependencies or artifacts are required?", audience: onboarder, required: true}
            - {name: artifact_access_route, description: "What approved authentication, request and safe retrieval instructions apply?", audience: onboarder, required: true}
          body: |
            Confirm the registry and artifact scope: $artifact_scope
            Follow the approved retrieval instructions: $artifact_access_route
          
            Retrieve an intended artifact with the permitted account and verify its
            identity or integrity using the project's documented method. Retrieval
            does not authorize publishing or deleting packages. Keep authentication
            material in the approved system, not a template or record. Do not switch
            to an untrusted mirror or disable verification to bypass missing access.
          steps:
            - id: retrieve-approved-artifact
              name: Obtain the intended dependency or artifact
              checks:
                - ask: Can you retrieve and identify the required artifact through the approved registry and authentication route?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","calendar-arrange"]
    expect:
      exit: 0
      stdout:
        equals: |
          # Arrange calendar access
          
          Identify the configured calendar service, account grantor and approved request
          process. Shared setup and sharing rules stay in the plan. Put the individual's
          request in an access arrangement for an actual declared calendar section
          instance, rather than inventing a calendar kind or silently selecting an activity.
          
          Keep a stable unique arrangement id and name known directory references.
          Arranged requires an accountable owner and nonsecret reference. Pending,
          requested and deferred can show missing details; supplied unknown contacts or
          sections remain invalid. Use a real optional targetDate to coordinate support.
          Do not record private calendar contents or personal reasons for availability.
          
          Coordinate a harmless invitation or support contact so the newcomer can test
          viewing and responding after access is available. Sending an invitation and
          granting an account are not verification of calendar use. If setup depends on
          another service, make the support need clear without inventing a runtime
          prerequisite edge. Preparation records arrangements, never newcomer outcomes.
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=chat-arrange"]
    expect:
      exit: 0
      stdout:
        equals: |
          # Arrange chat membership
          
          Confirm the organization's actual chat service, intended account and relevant
          workspaces or channels. Keep shared joining instructions and fallback routes
          in the plan. Do not assume a provider or create an account automatically.
          Identify an initial route that does not depend on already having chat access.
          
          Use access arrangements for person-specific requests against actual declared
          chat section instances. Distinct resources may need separate arrangements with
          stable unique ids. Arranged requires a known owner and nonsecret reference;
          helpers are included only when assigned. Pending, requested and deferred may
          retain visible gaps, but unknown supplied contacts or sections are invalid.
          Do not store invitations containing secret tokens or recovery material.
          
          Confirm who can resolve expired invitations or missing channel membership.
          Targets coordinate support and do not fail the newcomer. A sent invitation or
          arranged request does not establish that messages can be exchanged; the
          newcomer verifies the actual capability. No chat-specific kind or outcome field
          is introduced, and neither plan answers nor personal record are changed.
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","ci-access"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: ci-access
          title: CI access
          summary: Access required pipeline results and actions
          timing: anytime
          variables:
            - {name: pipeline_scope, description: "Which pipelines, result views and authorized actions does the role need?", audience: onboarder, required: true}
            - {name: pipeline_access_route, description: "Who grants CI access and how should required capabilities be verified safely?", audience: onboarder, required: true}
          body: |
            Review the required pipeline scope: $pipeline_scope
            Follow the access and safe verification route: $pipeline_access_route
          
            Open a relevant run and find its checks, logs and outcome. Learn which
            actions can spend resources, publish artifacts or affect environments.
            Viewing a run does not authorize rerunning or changing it. Never expose
            secret log material in onboarding notes. Confirm any action permission
            through the agreed safe procedure rather than triggering a live pipeline.
          steps:
            - id: inspect-required-pipeline
              name: Find required CI results and understand action boundaries
              checks:
                - ask: Can you inspect the relevant pipeline results and identify which actions you are authorized to take?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=codebase-orientation"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: codebase-orientation
          title: Understand the codebase
          summary: Locate main components and trace a relevant flow
          timing: week-one
          variables:
            - {name: codebase_map, description: "Which architecture material and main code locations should be explored?", audience: onboarder, required: true}
            - {name: tracing_exercise, description: "Which relevant flow should be traced and who can discuss its design?", audience: onboarder, required: true}
          body: |
            Start with the current architecture and locations: $codebase_map
            Trace and discuss this useful flow: $tracing_exercise
          
            Follow an input through the important components to its observable
            result. Locate related tests, ownership and failure handling. Compare
            the diagram with the actual code and ask about discrepancies. Aim for
            enough understanding to make a safe first change, not memorization of
            every module. Share corrections through the team's review process.
          steps:
            - id: explain-code-flow
              name: Explain a relevant flow through the codebase
              checks:
                - ask: Can you locate the main components and explain a relevant flow, its tests and the owners to consult?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","company-calendar"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: company-calendar
          title: Company calendar
          summary: View the calendar and respond to invitations
          timing: week-one
          variables:
            - {name: calendar_process, description: "Which calendar service, setup instructions and sharing rules apply?", audience: onboarder, required: true}
            - {name: calendar_test, description: "Which harmless invitation or support contact can be used to verify calendar access?", audience: onboarder, required: true}
          body: |
            Follow the calendar setup and sharing instructions: $calendar_process
            Verify with the supplied invitation or contact: $calendar_test
          
            Check the displayed time zone before responding. Open an intended event,
            inspect its joining details and send an appropriate response. Confirm
            that your availability is shared only as policy requires. A meeting
            invitation being sent does not prove you can view or answer it.
          steps:
            - id: answer-invitation
              name: Open and respond to an intended calendar invitation
              checks:
                - ask: Can you view the intended calendar and respond to an invitation with the correct time zone?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=company-email"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: company-email
          title: Company email
          summary: Send and receive mail
          timing: week-one
          variables:
            - {name: email_process, description: "Which approved mail service and setup instructions apply?", audience: onboarder, required: true}
            - {name: email_test_route, description: "Which business contact or safe test procedure should verify sending and receiving mail?", audience: onboarder, required: true}
          body: |
            Set up the approved mail service using $email_process.
            Use the safe test procedure or contact: $email_test_route
          
            Confirm the mailbox is your intended company mailbox. Send a nonsecret
            test message and receive a reply or equivalent approved test. Check how
            to reach support if mail is unavailable, rather than depending on that
            mailbox to obtain its own access. Never forward business mail to a
            personal account as an onboarding workaround.
          steps:
            - id: exchange-mail
              name: Verify sending and receiving
              checks:
                - ask: Have you sent and received a nonsecret test message using the intended company mailbox?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","company-identity"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: company-identity
          title: Company identity and SSO
          summary: Required authentication works
          timing: week-one
          variables:
            - {name: identity_process, description: "What approved account activation and authentication instructions apply?", audience: onboarder, required: true}
            - {name: identity_support, description: "Who handles identity provisioning, recovery and authentication problems through an approved route?", audience: onboarder, required: true}
          body: |
            Use the approved identity process: $identity_process
            Get provisioning or recovery help through $identity_support.
          
            Confirm that the account belongs to you before activation. Set up the
            required authentication factors through the approved system, keeping
            passwords and recovery material out of onboarding files. Test sign-in to
            a permitted service and sign out afterwards where appropriate. A request
            or activation email alone does not prove working authentication.
          steps:
            - id: verify-authentication
              name: Verify the required authentication flow
              checks:
                - ask: Can you authenticate with your own intended account and required factors to an approved service?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=contribution-practices"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: contribution-practices
          title: Learn contribution and review practices
          summary: Understand branching, review, checks, and the definition of done
          timing: anytime
          variables:
            - {name: contribution_policy, description: "Where are the current branching, change, review and completion rules?", audience: onboarder, required: true}
            - {name: contribution_discussion, description: "Who can explain authorization, required checks and exceptions for a first contribution?", audience: onboarder, required: true}
          body: |
            Review the contribution rules: $contribution_policy
            Resolve questions through $contribution_discussion.
          
            Walk through an example change from task to delivery. Identify required
            reviews, checks, release conditions and who may approve or merge. Ask how
            to handle disagreement and an urgent exception; do not invent one.
            Access to a control is not authorization to use it. Keep the team's
            definition of done visible before beginning the first contribution.
          steps:
            - id: explain-contribution-process
              name: Explain how a contribution becomes done
              checks:
                - ask: Can you explain the required branching, review, checks and authorization before a contribution is considered done?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","day-ninety-review"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: day-ninety-review
          title: Review 90-day goals
          summary: Agree on outcomes and the next phase
          timing: days-31-to-90
          variables:
            - {name: ninety_day_review, description: "How is the roughly ninety-day review arranged and which outcomes should be discussed?", audience: onboarder, required: true}
            - {name: next_phase_process, description: "How are next-phase priorities, ownership and support agreed?", audience: onboarder, required: true}
          body: |
            Arrange the review using $ninety_day_review.
            Agree the next phase through $next_phase_process.
          
            Discuss outcomes, confidence, unresolved dependencies and what should
            change in the support model. Keep organizational barriers visible and
            make room for feedback on onboarding itself. Agree next responsibilities
            rather than inferring them from time served. The planning window neither
            fails someone nor grants access, authority or automatic completion.
          steps:
            - id: agree-next-phase
              name: Review outcomes and agree the next phase
              checks:
                - ask: Have you reviewed the relevant outcomes and agreed next-phase priorities, responsibilities and support?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=day-thirty-review"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: day-thirty-review
          title: Review 30-day goals
          summary: Agree on progress, feedback, and revised priorities
          timing: days-8-to-30
          variables:
            - {name: thirty_day_review, description: "How is the roughly thirty-day review arranged and which shared goals guide it?", audience: onboarder, required: true}
            - {name: review_support_route, description: "Who can revise priorities and arrange support after the review?", audience: onboarder, required: true}
          body: |
            Arrange the review and revisit the shared goals: $thirty_day_review
            Agree changes and support through $review_support_route.
          
            Discuss useful outcomes, remaining blockers, feedback and changing work.
            Distinguish verified progress from requests, attempts and unavailable
            opportunities. Revise priorities with the people involved and name any
            support actions. Around day thirty is a planning goal, not a pass/fail
            deadline or a demand for private performance notes in an onboarding file.
          steps:
            - id: agree-next-month-priorities
              name: Review progress and revise the next priorities
              checks:
                - ask: Have you discussed progress and feedback and agreed revised priorities and support with the relevant owner?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","deploy-lead"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: deploy-lead
          title: Lead a deploy with support
          summary: Lead an appropriate deployment with experienced support available
          timing: anytime
          variables:
            - {name: lead_deploy_policy, description: "What readiness, authorization and supported deployment procedure must a first lead satisfy?", audience: onboarder, required: true}
            - {name: deploy_stop_rules, description: "Who may stop or roll back deployment and how is experienced support reached?", audience: onboarder, required: true}
          body: |
            Follow the first-lead policy and reviewed procedure: $lead_deploy_policy
            Confirm stop decisions, rollback and support: $deploy_stop_rules
          
            Confirm a suitable deployment and available experienced supporter in
            preparation. Check current authorization and readiness before acting.
            Lead only the agreed scope, verify the result and follow up with the
            supporter. Stop or postpone when conditions are unsafe. A target date or
            onboarding goal never authorizes deployment or excuses missing support.
          steps:
            - id: lead-supported-deployment
              name: Lead an authorized deployment with experienced support
              checks:
                - ask: Have you led the agreed authorized deployment with support available and verified its outcome under the runbook?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=deploy-lead-assign"]
    expect:
      exit: 0
      stdout:
        equals: |
          # Assign an experienced deploy lead
          
          Find an experienced person leading an appropriate deployment for the newcomer
          to observe. Keep the deployment runbook and shared safety rules in the plan.
          Use deploy-shadow for this personal arrangement and name an actual declared
          shadowing section instance; the guide's title does not introduce a new kind.
          
          An arranged item requires a known accountable owner, at least one known helper
          and a nonsecret deployment opportunity reference. Here helpers are experienced
          leads whom the newcomer observes. They are not automatically supporters for a
          newcomer-led deployment. Keep a stable unique id and optional real planning
          target. Missing details may be pending, requested or deferred, but unknown
          supplied helpers or section references are invalid.
          
          Confirm observation access and a route for questions without granting control
          authority. Discuss verification, rollback and cancellation. A scheduled or
          arranged deployment is not observed work or a verified newcomer outcome.
          If conditions change, rearrange the opportunity; the date does not compel it.
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","deploy-shadow"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: deploy-shadow
          title: Shadow a deploy
          summary: Observe preparation, deployment, verification, and rollback considerations
          timing: days-8-to-30
          variables:
            - {name: deployment_runbook, description: "Which deployment process and runbook should be observed?", audience: onboarder, required: true}
            - {name: shadow_expectations, description: "How is a safe observation opportunity arranged and what questions should the observer cover?", audience: onboarder, required: true}
          body: |
            Review the process before observing: $deployment_runbook
            Arrange the opportunity and learning focus: $shadow_expectations
          
            Confirm the experienced lead and deployment opportunity in preparation.
            Observe readiness checks, authorization, execution, verification and
            rollback considerations. Ask when a deploy should stop and who decides.
            Observation does not authorize operating production controls. If the
            planned deployment is cancelled or unsuitable, rearrange it instead of
            treating the planning date as a failure.
          steps:
            - id: observe-deployment-lifecycle
              name: Observe an experienced lead through a deployment
              checks:
                - ask: Have you observed the deployment lifecycle and discussed readiness, verification, rollback and decision ownership?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=deploy-support-assign"]
    expect:
      exit: 0
      stdout:
        equals: |
          # Assign deployment support
          
          Arrange a suitable authorized deployment and experienced support for the
          newcomer to lead it. Keep the runbook, readiness and stop rules in the plan.
          Use deploy-lead for the person-specific arrangement and an actual declared
          lead-deployment section instance. Never infer readiness from a planning date.
          
          An arranged item needs a known accountable owner, at least one known helper
          and a nonsecret opportunity reference. For this kind helpers are experienced
          observers or supporters, not the lead being shadowed. Give the item a stable
          unique id and optional real targetDate. Pending, requested or deferred keep
          missing support visible; unknown supplied contacts and sections are invalid.
          
          Confirm support availability, authority to act, safe scope, verification and
          rollback decisions. Do not grant production rights solely for onboarding.
          Arranged is a minimum preparation claim, not permission at action time,
          successful deployment or a verified newcomer outcome. Preserve the committed
          ownership boundaries: no shared-answer injection or personal-record writes.
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","design-contribution"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: design-contribution
          title: First design contribution
          summary: Take a suitable contribution through the team's process
          timing: days-8-to-30
          variables:
            - {name: design_contribution_scope, description: "What makes a first design contribution suitable and how should its scope be agreed?", audience: onboarder, required: true}
            - {name: design_contribution_process, description: "Which support, review and completion process must that contribution follow?", audience: onboarder, required: true}
          body: |
            Agree a suitable real contribution using $design_contribution_scope.
            Follow the support and completion process: $design_contribution_process
          
            Clarify the user need, constraints and expected evidence with the owner.
            Explore and communicate the proposed change, seek the required review
            and follow through on the agreed handoff. Keep research and personal
            data within approved systems. A first-month goal does not justify
            bypassing research, accessibility, approval or collaboration expectations.
          steps:
            - id: complete-design-contribution
              name: Complete a suitably scoped design contribution
              checks:
                - ask: Has your agreed contribution met the team's review, evidence and handoff conditions with support available?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=design-handoff"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: design-handoff
          title: Learn design review and handoff
          summary: Understand review, approval, and collaboration expectations
          timing: anytime
          variables:
            - {name: design_handoff_process, description: "What design review, approval and engineering handoff process applies?", audience: onboarder, required: true}
            - {name: design_handoff_example, description: "Which reviewed example and discussion contact can explain expected handoff evidence?", audience: onboarder, required: true}
          body: |
            Review the collaboration process: $design_handoff_process
            Walk through the supplied example with $design_handoff_example.
          
            Identify how intent, states, accessibility, constraints and unresolved
            questions are communicated. Learn who approves what and how changes
            remain visible after handoff. A shared link is not proof that another
            discipline has the context it needs. Ask about ambiguous responsibilities
            rather than assuming that design sign-off grants delivery authority.
          steps:
            - id: explain-design-handoff
              name: Explain a useful reviewed design handoff
              checks:
                - ask: Can you explain the review, approval and collaboration evidence needed for a useful handoff?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id","design-system-review"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: design-system-review
          title: Review the design system
          summary: Find and use the system and main product files
          timing: week-one
          variables:
            - {name: design_system_material, description: "Where are the current design system, main product files and usage guidance?", audience: onboarder, required: true}
            - {name: design_system_discussion, description: "Which representative task should be explored and who explains gaps or contribution rules?", audience: onboarder, required: true}
          body: |
            Explore the current system and product files: $design_system_material
            Discuss a representative use through $design_system_discussion.
          
            Locate the relevant components, patterns, accessibility guidance and
            source of truth. Explain how a common interface uses them and how an
            exception is reviewed. Distinguish a published component from a draft.
            If no system exists, ask the team to identify current conventions and
            gaps; do not invent a claim that an established system was reviewed.
          steps:
            - id: explain-system-use
              name: Locate and explain a useful design-system pattern
              checks:
                - ask: Can you find the current design references and explain how to use or discuss a relevant pattern and its gaps?
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","export","--id=design-workspace"]
    expect:
      exit: 0
      stdout:
        equals: |
          schemaVersion: 1
          id: design-workspace
          title: Design workspace access
          summary: Access required files and tools
          timing: week-one
          variables:
            - {name: design_workspace_scope, description: "Which configured design tools, workspaces and file capabilities does the role require?", audience: onboarder, required: true}
            - {name: design_access_route, description: "How is design access requested and safely verified, and who handles problems?", audience: onboarder, required: true}
          body: |
            Confirm the required tools, files and capability: $design_workspace_scope
            Follow the access and verification route: $design_access_route
          
            Open the intended workspace with your approved identity. Verify the
            permitted capability on an agreed safe file; viewing is not editing
            authority. Learn where current work lives and what may be shared outside
            the team. Do not duplicate restricted assets into a personal workspace
            or request organization-wide rights to resolve a narrow access problem.
          steps:
            - id: verify-design-workspace
              name: Verify the intended design files and capability
