name: walk-onboardee-has-no-sections-or-contacts
description: The newcomer's walk shows no Sections or Contacts tab, and the keys s and c open nothing.
source: docs/reference/tui.md
steps:
  - run: [onboard-kit, walk, --plan, acme.obk.yaml, --audience, onboardee]
    files:
      acme.obk.yaml: {from: docs/reference/examples/acme/acme.obk.yaml}
    terminal:
      size: {columns: 110, rows: 32}
      actions:
        - wait-for: "Your onboarding"
        - press: o
        - wait-for: "esc your questions  q quit"
        - wait-for: "Your questions w"
        - wait-gone: "Sections"
        - wait-gone: "Contacts"
        - press: s
        - press: c
        - press: q
        - wait-exit: true
        - expect-modes: {alternate_screen: false, cursor_visible: true, bracketed_paste: false}
    expect:
      exit: 0
