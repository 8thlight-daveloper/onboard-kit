name: prepare-guide-clear-preserves-owned-data
description: Clearing two recipient facts retains other details, arrangements, unknown values and malformed newcomer work.
source: docs/decisions/0190-incremental-preparation-repair.md; docs/decisions/0340-guided-preparation-save.md; contracts/preparation/guide/contract.md; acceptance/testdata/guide/sources.md
steps:
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    files:
      plan.yaml: {from: acceptance/testdata/preparation/plan.yaml}
      records/newcomer-one/preparation.obk.yaml: {from: acceptance/testdata/preparation/preparation.yaml}
      records/newcomer-one/record.obk.yaml: "PRIVATE_PROGRESS: [\n"
      records/newcomer-two/preparation.obk.yaml: "OTHER_PERSONS_PREPARATION\n"
      records/newcomer-two/record.obk.yaml: "OTHER_PERSONS_PROGRESS\n"
    stdin: |
      recipient
      1
      keep
      2
      clear
      3
      clear
      apply
      review
      save
    expect:
      exit: 0
      stdout: {contains: 'Company email: "example@company.example" -> "" [cleared]'}
      stderr:
        json: {status: saved, code: guide.saved, message: Preparation saved.}
      unchanged: [plan.yaml, records/newcomer-one/record.obk.yaml, records/newcomer-two/preparation.obk.yaml, records/newcomer-two/record.obk.yaml]
      files:
        records/newcomer-one/preparation.obk.yaml: {same-as: acceptance/testdata/guide/cleared-recipient.yaml}
        invitation.zip: {absent: true}
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    stdin: |
      review
      cancel
    expect:
      exit: 0
      stdout: {contains: 'Question: "plan.organization"'}
      stderr:
        json: {status: cancelled, code: guide.cancelled, message: Cancelled. No files changed.}
      unchanged: [plan.yaml, records/newcomer-one/preparation.obk.yaml, records/newcomer-one/record.obk.yaml, records/newcomer-two/preparation.obk.yaml, records/newcomer-two/record.obk.yaml]
