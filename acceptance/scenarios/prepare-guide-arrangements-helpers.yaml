name: prepare-guide-arrangements-helpers
description: Nested helper back and enclosing back preserve noncanonical bytes; removal selects one repeated occurrence.
source: docs/decisions/0340-guided-preparation-save.md; docs/decisions/0350-guided-support-arrangements.md; acceptance/testdata/guide-arrangements/sources.md
steps:
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    files:
      plan.yaml: {from: acceptance/testdata/guide-arrangements/plan.yaml}
      records/newcomer-one/preparation.obk.yaml: |-
        # Preserve this comment, flow style and absent final newline.
        schemaVersion: 1
        kind: preparation
        account: newcomer-one
        planId: plan-one
        arrangements: [{id: save, section: review, kind: pairing, owner: owner-one, contacts: [save, back, save, clear], reference: cancel, targetDate: "2020-02-29", status: arranged, note: q}]
    stdin: |
      arrangements
      edit
      1
      4
      clear
      add
      buddy-one
      back
      4
      apply
      apply
      edit
      1
      4
      clear
      apply
      back
      back
      review
      save
    expect:
      exit: 0
      stdout:
        contains: |
          Draft arrangements:
          Arrangement 1:
          ID: "save"
          Section ID: "review"
          Kind: "pairing"
          Accountable owner contact ID: "owner-one"
          Assigned contacts:
          1. "save"
          2. "back"
          3. "save"
          4. "clear"
          Reference: "cancel"
          Target date (goal): "2020-02-29"
          Preparation status: "arranged"
          Note: "q"
      stderr:
        json: {status: unchanged, code: guide.unchanged, message: Preparation unchanged. Original bytes preserved.}
      unchanged: [plan.yaml, records/newcomer-one/preparation.obk.yaml]
      files:
        invitation.zip: {absent: true}
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    stdin: |
      arrangements
      edit
      1
      4
      remove

      01
      1
      apply
      apply
      back
      review
      save
    expect:
      exit: 0
      stdout:
        contains: |
          Draft arrangements:
          Arrangement 1:
          ID: "save"
          Section ID: "review"
          Kind: "pairing"
          Accountable owner contact ID: "owner-one"
          Assigned contacts:
          1. "back"
          2. "save"
          3. "clear"
          Reference: "cancel"
          Target date (goal): "2020-02-29"
          Preparation status: "arranged"
          Note: "q"
      stderr:
        json: {status: saved, code: guide.saved, message: Preparation saved.}
      unchanged: [plan.yaml]
      files:
        records/newcomer-one/preparation.obk.yaml: {same-as: acceptance/testdata/guide-arrangements/helpers.yaml}
