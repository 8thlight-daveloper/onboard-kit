name: prepare-guide-cancel-without-publication
description: Cancellation and EOF discard staged recipient edits without creating any preparation directory.
source: docs/decisions/0340-guided-preparation-save.md; contracts/preparation/guide/contract.md; acceptance/testdata/guide/sources.md
steps:
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    files:
      plan.yaml: {from: acceptance/testdata/preparation/plan.yaml}
      unrelated.yaml: "PRESERVE_UNRELATED_WORK\n"
    stdin: |
      cancel
    expect:
      exit: 0
      stderr:
        json: {status: cancelled, code: guide.cancelled, message: Cancelled. No files changed.}
      unchanged: [plan.yaml, unrelated.yaml]
      files:
        records: {absent: true}
        invitation.zip: {absent: true}
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    expect:
      exit: 0
      stderr:
        json: {status: cancelled, code: guide.cancelled, message: Cancelled. No files changed.}
      unchanged: [plan.yaml, unrelated.yaml]
      files:
        records: {absent: true}
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    stdin: |
      recipient
      1
      change
      Uncommitted name
      apply
      cancel
    expect:
      exit: 0
      stderr:
        json: {status: cancelled, code: guide.cancelled, message: Cancelled. No files changed.}
      unchanged: [plan.yaml, unrelated.yaml]
      files:
        records: {absent: true}
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    stdin: |
      recipient
      1
      change
      Uncommitted name
      apply
      review
      cancel
    expect:
      exit: 0
      stdout: {contains: 'Name: "" -> "Uncommitted name"'}
      stderr:
        json: {status: cancelled, code: guide.cancelled, message: Cancelled. No files changed.}
      unchanged: [plan.yaml, unrelated.yaml]
      files:
        records: {absent: true}
        invitation.zip: {absent: true}
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    stdin: |-
      recipient
      1
      change
      Uncommitted name
      apply
      review
      save
    expect:
      exit: 0
      stdout: {contains: 'Review complete. Choose save, back, or cancel:'}
      stderr:
        json: {status: cancelled, code: guide.cancelled, message: Cancelled. No files changed.}
      unchanged: [plan.yaml, unrelated.yaml]
      files:
        records: {absent: true}
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    stdin: |
      recipient
      1
      change
      Discarded local form
      back
      review

      cancel
    expect:
      exit: 0
      stdout: {contains: 'Name: "" -> ""'}
      stderr:
        json: {status: cancelled, code: guide.cancelled, message: Cancelled. No files changed.}
      unchanged: [plan.yaml, unrelated.yaml]
      files:
        records: {absent: true}
