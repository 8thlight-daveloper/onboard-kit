name: stdio-question-flow
description: Answering the plan questions over stdio applies each answer and shrinks the list of blockers.
source: docs/decisions/0010-plan-editor.md, the stdio commands
steps:
  - run: [onboard-kit, stdio, --templates, templates, --generated-on, "2026-10-15"]
    files:
      templates/access.yaml: {from: docs/reference/examples/acme/templates/access.yaml}
      templates/clone-and-run-tests.yaml: {from: docs/reference/examples/acme/templates/clone-and-run-tests.yaml}
      templates/review-design-system.yaml: {from: docs/reference/examples/acme/templates/review-design-system.yaml}
      templates/stuck-general.yaml: {from: docs/reference/examples/acme/templates/stuck-general.yaml}
      templates/plan-variables.yaml: {from: docs/reference/examples/acme/templates/plan-variables.yaml}
    talk:
      - send: {command: blockers}
        expect:
          ok: true
          blockers: [plan.organization, plan.team, plan.team_state, plan.discipline, access.onboarding_owner_role, access.access_request_url, access.repo_url, access.ci_grantor, access.tracker_grantor, stuck-general.general_contacts]
      - send: {command: submit, question: plan.organization, value: ACME Corp}
        expect: {ok: true, applied: true, problems: []}
      - send: {command: submit, question: plan.discipline, value: software}
        expect: {ok: true, applied: true, problems: []}
      - send: {command: submit, question: access.tracker_grantor, value: {deferred: true}}
        expect: {ok: true, applied: true, problems: []}
      - send: {command: blockers}
        expect:
          ok: true
          blockers: [plan.team, plan.team_state, access.onboarding_owner_role, access.access_request_url, access.repo_url, access.ci_grantor, clone-and-run-tests.repo_url, clone-and-run-tests.setup_command, clone-and-run-tests.test_command, stuck-general.general_contacts]
    expect:
      exit: 0
