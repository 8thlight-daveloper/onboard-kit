name: new-then-assemble
description: A plan built from the ACME templates assembles into a document with its sections and gap table.
source: docs/reference/examples/acme/README.md
steps:
  - run: [onboard-kit, new, --templates, templates, --template-set, example, --generated-on, "2026-10-15", --out, plan.obk.yaml]
    files:
      templates/access.yaml: {from: docs/reference/examples/acme/templates/access.yaml}
      templates/clone-and-run-tests.yaml: {from: docs/reference/examples/acme/templates/clone-and-run-tests.yaml}
      templates/review-design-system.yaml: {from: docs/reference/examples/acme/templates/review-design-system.yaml}
      templates/stuck-general.yaml: {from: docs/reference/examples/acme/templates/stuck-general.yaml}
      templates/plan-variables.yaml: {from: docs/reference/examples/acme/templates/plan-variables.yaml}
    expect:
      exit: 0
  - run: [onboard-kit, assemble, --plan, plan.obk.yaml]
    expect:
      exit: 0
      stdout: {contains: "## Gaps to fill"}
