name: prepare-guide-arrangements-collision
description: New mode never upserts an existing permanent ID, and a refused proposal cannot alter the accepted draft.
source: docs/decisions/0350-guided-support-arrangements.md; acceptance/testdata/guide-arrangements/sources.md
steps:
  - run: [onboard-kit, prepare, guide, --plan, plan.yaml, --account, newcomer-one]
    files:
      plan.yaml: {from: acceptance/testdata/guide-arrangements/plan.yaml}
      records/newcomer-one/preparation.obk.yaml: {from: acceptance/testdata/guide-arrangements/full.yaml}
    stdin: |
      arrangements
      new
      id
      change
      save
      1
      change
      ticket-pairing
      2
      change
      support
      7
      change
      pending
      apply
      back
      back
      review
      save
    expect:
      exit: 0
      stdout:
        contains: |
          Arrangement not applied.
          Severity: "error" Code: "guide.arrangement-exists" Path: "arrangements"
      stderr:
        json: {status: unchanged, code: guide.unchanged, message: Preparation unchanged. Original bytes preserved.}
      unchanged: [plan.yaml, records/newcomer-one/preparation.obk.yaml]
      files:
        invitation.zip: {absent: true}
