name: catalog-help-and-private-refusals
description: Help precedence and malformed or unknown requests preserve local files and return fixed reports rather than echoing supplied private tokens.
source: docs/decisions/0320-embedded-catalog-availability.md; contracts/command/catalog/contract.md syntax and reports; contracts/command/catalog/testdata/arguments.json; contracts/command/catalog/testdata/help.txt
steps:
  - run: ["onboard-kit","catalog","--help","PRIVATE_IGNORED_ARG"]
    files:
      plan.obk.yaml: "PRIVATE_EXISTING_PLAN_BYTES\n"
      preparation.obk.yaml: "PRIVATE_EXISTING_PREPARATION_BYTES\n"
      record.obk.yaml: "PRIVATE_EXISTING_RECORD_BYTES\n"
      company-email.yaml: "PRIVATE_EXISTING_CUSTOM_TEMPLATE_BYTES\n"
    expect:
      exit: 0
      stdout:
        equals: |
          Usage: onboard-kit catalog list
                 onboard-kit catalog show --id ID
                 onboard-kit catalog export --id ID
          
          list prints JSON inventory. show displays complete catalog content.
          export prints section YAML or preparation/tool-help Markdown; it writes no files.
      stderr: {equals: ""}
      files:
        catalog-output.yaml: {absent: true}
      unchanged: ["plan.obk.yaml","preparation.obk.yaml","record.obk.yaml","company-email.yaml"]
  - run: ["onboard-kit","catalog","list","--help","--PRIVATE_UNKNOWN"]
    expect:
      exit: 0
      stdout:
        equals: |
