schemaVersion: 1
provenance:
  templateSet: example
  generatedOn: "2026-10-15"
variables:
  - name: organization
    description: What is the organization's name?
    example: ACME Corp
    required: true
  - name: team
    description: Which team are you joining?
    example: Platform team
    required: true
    audience: onboardee
  - name: team_state
    description: Is the team established, or are we the first consultants?
    type: choice
    options:
      - established
      - first-consultants
    required: true
  - name: discipline
    description: What kind of work will you do?
    type: choice
    options:
      - software
      - design
    required: true
    audience: onboardee
sections:
  - id: access
    title: Access
    summary: Request the accounts and permissions you need, and record who grants each.
    timing: before-day-one
    owner: $onboarding_owner_role
    verification: You can open the repository, the CI dashboard, and the work tracker.
    body: |
      Request each system on day minus five if you can. Record who grants it and when
      you asked.
    variables:
      - name: onboarding_owner_role
        description: Who owns onboarding here? Give their role. It appears as the owner of the Access section.
        example: Engineering manager
        required: true
        default: Engineering manager
      - name: access_request_url
        description: Where do people request source control access?
        example: https://access.example.test/request
        required: true
      - name: repo_url
        description: What is the clone URL of the main repository?
        example: git@git.example.test:team/service.git
        pattern: "^(git@|https://)\\S+$"
        patternHint: A clone URL, starting with git@ or https://
        required: true
      - name: source_control_grantor
        description: Who grants source control access?
        example: IT service desk
        required: true
        askIf:
          all:
            - question: repo_url
              answer:
                isSettled: true
      - name: ci_grantor
        description: Who grants CI dashboard access?
        example: Platform team lead
        required: true
      - name: tracker_grantor
        description: Who grants work tracker access?
        example: Engineering manager
        required: true
      - name: account_name
        description: What is your account name at the organization?
        example: arivera
        audience: onboardee
    steps:
      - id: source-control
        name: Source control
        owner: $source_control_grantor
        open: $access_request_url
        checks:
          - run:
              - git
              - ls-remote
              - $repo_url
      - id: ci-dashboard
        name: CI dashboard
        notes: Sign in as $account_name.
        owner: $ci_grantor
        checks:
          - ask: Can you open the CI dashboard?
      - id: work-tracker
        name: Work tracker
        owner: $tracker_grantor
        checks:
          - ask: Can you open the work tracker?
    source:
      template: access
      hash: "0661566cb6eb7a0d131133bb75f42f339b79bcccfdf39e49f2028e19c0e70a5a"
  - id: clone-and-run-tests
    title: Clone the project and run the tests
    summary: Get a working copy of the project and a passing test run on your machine.
    includeIf:
      all:
        - question: plan.discipline
          answer:
            is: software
    timing: week-one
    owner: newcomer
    verification: $test_command passes on a fresh clone.
    body: |
      If a test fails on a fresh clone, write down the failure and ask the team before
      changing anything.
    variables:
      - name: repo_url
        description: What is the clone URL of the main repository?
        example: git@git.example.test:team/service.git
        pattern: "^(git@|https://)\\S+$"
        patternHint: A clone URL, starting with git@ or https://
        required: true
      - name: repo_dir
        description: What should the clone's folder be called?
        example: service
        default: project
      - name: setup_command
        description: Which command installs the dependencies?
        example: make setup
        type: command
        required: true
      - name: test_command
        description: Which command runs the test suite?
        example: make test
        type: command
        required: true
    steps:
      - id: clone
        name: Clone the repository
        run:
          - git
          - clone
          - $repo_url
          - $repo_dir
        checks:
          - run:
              - test
              - "-d"
              - $repo_dir/.git
      - id: install
        name: Install dependencies
        run:
          - $setup_command
        directory: $repo_dir
      - id: run-tests
        name: Run the tests
        run:
          - $test_command
        directory: $repo_dir
    source:
      template: clone-and-run-tests
      hash: c41d0df0aad1fe56eeaa2a0cc2d17a19ba3bc92b022a41342a0e37482d8195a6
  - id: review-design-system
    title: Review the design system
    summary: Find the design system and the main design file, and note what you cannot open.
    includeIf:
      all:
        - question: plan.discipline
          answer:
            is: design
    timing: week-one
    owner: newcomer
    verification: You can open the design system and the main design file.
    body: |
      Look at the design system before you start work. Write down anything that is
      missing or out of date, and tell the team.
    variables:
      - name: design_system_url
        description: Where does the design system live?
        example: https://design.example.test/system
        required: true
      - name: design_file_url
        description: Which is the main design file for the product?
        example: https://design.example.test/files/main
        required: true
    steps:
      - id: design-system
        name: Open the design system
        open: $design_system_url
        checks:
          - ask: Can you open the design system?
      - id: main-file
        name: Open the main design file
        open: $design_file_url
        checks:
          - ask: Can you open the main design file?
    source:
      template: review-design-system
      hash: cc51afd7c908815771c0be4cff508754c8ddeafd7b835e0234219c82d3d96fb9
  - id: stuck-general
    title: If you are stuck
    summary: Who to ask when something is blocked and nobody named in a section can help.
    timing: anytime
    body: |
      If a step is blocked and the people named in its section cannot help, ask these people
      first: $general_contacts.
      Say what you tried and what you need. They will point you to someone else to try.
    variables:
      - name: general_contacts
        description: Who can anyone ask for help with anything?
        example: Alex Rivera, alex.rivera@acme.example, @alex
        type: person
        multiple: true
        required: true
    source:
      template: stuck-general
      hash: b41dc482fe0a513d1474cb641d00f890914ee5722c24f6d04e61d6a0cc553829
