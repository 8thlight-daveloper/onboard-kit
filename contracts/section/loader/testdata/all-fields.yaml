schemaVersion: 1
steps:
  - id: run
    name: Run it
    notes: Look at $$HOME first.
    owner: $role
    timing: week-one
    escalation: [$backup]
    run: [make, test, $target]
    open: https://docs.acme.example/run
    directory: $repo_dir
    env:
      APP_ENV: test
      TOKEN: $token
    checks:
      - run: [make, check]
      - ask: Did it pass?
      - env: STAGING_API_TOKEN
body: |
  Run the build.
  Then check it.
variables:
  - name: review
    type: boolean
    description: Run the review?
    default: true
  - name: target
    example: release
    description: Build target
    type: choice
    options: [debug, release]
    default: debug
    required: true
    audience: onboarder
  - name: code
    description: A code
    example: ABC
    pattern: '^[A-Z]{3}$'
    patternHint: Three capitals
    audience: onboardee
  - name: build_command
    type: command
    description: Build command
    default: [make, build]
  - name: backup
    type: person
    multiple: true
    description: Backup
    askIf:
      all:
        - question: target
          answer:
            is: release
        - question: plan.discipline
          answer:
            isNot: design
        - question: plan.team_state
          answer:
            isOneOf: [established, first-consultants]
        - question: plan.team_state
          answer:
            isNotOneOf: [x, z]
        - question: review
          answer:
            isSettled: false
        - question: code
          answer:
            is: true
            isNot: deferred
        - section: setup
          enabled: true
        - section: access
          enabled: false
        - enabled: false
          section:
verification: It works.
owner: $role
escalation: [$backup]
after: [access, setup]
timing: days-8-to-30
includeIf:
  all:
    - question: plan.discipline
      answer:
        isOneOf: [software, design]
    - section: access
      enabled: true
summary: Do the thing.
title: All fields
id: all-fields
parent: access
