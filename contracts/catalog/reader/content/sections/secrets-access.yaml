schemaVersion: 1
id: secrets-access
title: Secrets manager access
summary: Obtain necessary secrets through the approved system
timing: anytime
variables:
  - {name: secret_scope, description: "Which approved secret-management system and minimum secret scope does the role need?", audience: onboarder, required: true}
  - {name: secret_handling, description: "What approved access, consumption, incident and support procedure applies without revealing secret values?", audience: onboarder, required: true}
body: |
  Confirm the approved system and minimum scope: $secret_scope
  Follow the handling and support procedure: $secret_handling

  Verify that the required application or approved workflow can consume
  the needed secret without copying it into onboarding material. Do not
  print values, share credentials, store recovery codes or attach a secret
  to a support request. Access approval is not permission to use every
  secret. Report accidental exposure through the security process.
steps:
  - id: verify-approved-secret-workflow
    name: Verify the approved secret-consumption workflow
    checks:
      - ask: Can the approved workflow obtain the necessary secret without exposing its value in onboarding files or messages?
