schemaVersion: 1

naming:
  pattern: noun/role
  depth-one-exceptions: [model, secrets, tui, binary]

kinds:
  model:
    imports: []
  core:
    imports: [model, core]
    banned-categories: [filesystem, network, process, terminal, randomness]
  driver:
    imports: [model, core, driver]
    banned-categories: [terminal]
  screen:
    imports: [model, core]
    banned-categories: [network]
  command:
    imports: [model, core, driver, screen, command]
  entry:
    imports: [command]

deferred-categories:
  clock: a package that also holds types the model may need, so an import check is too coarse
  environment: shares its package with filesystem, so a screen may read the environment and this check cannot tell

components:
  model:
    kind: model
    imports: []
  binary:
    kind: entry
    imports: [command/root]
